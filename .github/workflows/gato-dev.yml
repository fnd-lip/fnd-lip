            </g>

            <!-- Gato -->
            <g transform="translate(650 95)">
              <path d="M60 70 C25 70 10 45 15 20 L35 38 L52 12 L70 38 L95 20 C100 45 92 70 60 70Z" fill="#C9D1D9"/>
