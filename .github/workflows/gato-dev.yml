name: Gerar gato dev

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Criar animação do gato dev
        run: |
          mkdir -p dist

          cat > dist/gato-dev.svg <<'SVG'
          <svg width="900" height="260" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="900" height="260" rx="24" fill="#F6F8FA"/>

            <rect x="60" y="45" width="780" height="170" rx="18" fill="#FFFFFF" stroke="#D0D7DE"/>

            <circle cx="90" cy="72" r="7" fill="#FF605C"/>
            <circle cx="112" cy="72" r="7" fill="#FFBD44"/>
            <circle cx="134" cy="72" r="7" fill="#00CA4E"/>

            <text x="70" y="115" font-family="Fira Code, monospace" font-size="20" fill="#0969DA">$ npm run dev</text>
            <text x="70" y="148" font-family="Fira Code, monospace" font-size="18" fill="#24292F">Felipe Barbosa iniciando projetos...</text>
            <text x="70" y="178" font-family="Fira Code, monospace" font-size="18" fill="#57606A">mobile | web | dados | engenharia de software</text>

            <rect x="70" y="192" width="13" height="24" rx="3" fill="#0969DA">
              <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
            </rect>

            <g transform="translate(650 95)">
              <path d="M60 70 C25 70 10 45 15 20 L35 38 L52 12 L70 38 L95 20 C100 45 92 70 60 70Z" fill="#24292F"/>
              <circle cx="45" cy="47" r="5" fill="#F6F8FA">
                <animate attributeName="ry" values="5;1;5" dur="3s" repeatCount="indefinite"/>
              </circle>
              <circle cx="75" cy="47" r="5" fill="#F6F8FA">
                <animate attributeName="ry" values="5;1;5" dur="3s" repeatCount="indefinite"/>
              </circle>
              <path d="M58 55 L62 55 L60 59 Z" fill="#F6F8FA"/>
              <path d="M20 67 C-10 88 10 125 48 112" stroke="#24292F" stroke-width="12" stroke-linecap="round">
                <animate attributeName="d" values="M20 67 C-10 88 10 125 48 112;M20 67 C-5 95 18 118 48 112;M20 67 C-10 88 10 125 48 112" dur="2.5s" repeatCount="indefinite"/>
              </path>
              <rect x="25" y="70" width="70" height="58" rx="18" fill="#24292F"/>
              <rect x="18" y="116" width="84" height="24" rx="8" fill="#0969DA"/>
              <text x="33" y="134" font-family="Fira Code, monospace" font-size="13" fill="#FFFFFF">&lt;/&gt;</text>
            </g>
          </svg>
          SVG

          cat > dist/gato-dev-dark.svg <<'SVG'
          <svg width="900" height="260" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="900" height="260" rx="24" fill="#0D1117"/>

            <rect x="60" y="45" width="780" height="170" rx="18" fill="#161B22" stroke="#30363D"/>

            <circle cx="90" cy="72" r="7" fill="#FF605C"/>
            <circle cx="112" cy="72" r="7" fill="#FFBD44"/>
            <circle cx="134" cy="72" r="7" fill="#00CA4E"/>

            <text x="70" y="115" font-family="Fira Code, monospace" font-size="20" fill="#58A6FF">$ npm run dev</text>
            <text x="70" y="148" font-family="Fira Code, monospace" font-size="18" fill="#C9D1D9">Felipe Barbosa iniciando projetos...</text>
            <text x="70" y="178" font-family="Fira Code, monospace" font-size="18" fill="#8B949E">mobile | web | dados | engenharia de software</text>

            <rect x="70" y="192" width="13" height="24" rx="3" fill="#58A6FF">
              <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
            </rect>

            <g transform="translate(650 95)">
              <path d="M60 70 C25 70 10 45 15 20 L35 38 L52 12 L70 38 L95 20 C100 45 92 70 60 70Z" fill="#C9D1D9"/>
              <circle cx="45" cy="47" r="5" fill="#0D1117">
                <animate attributeName="ry" values="5;1;5" dur="3s" repeatCount="indefinite"/>
              </circle>
              <circle cx="75" cy="47" r="5" fill="#0D1117">
                <animate attributeName="ry" values="5;1;5" dur="3s" repeatCount="indefinite"/>
              </circle>
              <path d="M58 55 L62 55 L60 59 Z" fill="#0D1117"/>
              <path d="M20 67 C-10 88 10 125 48 112" stroke="#C9D1D9" stroke-width="12" stroke-linecap="round">
                <animate attributeName="d" values="M20 67 C-10 88 10 125 48 112;M20 67 C-5 95 18 118 48 112;M20 67 C-10 88 10 125 48 112" dur="2.5s" repeatCount="indefinite"/>
              </path>
              <rect x="25" y="70" width="70" height="58" rx="18" fill="#C9D1D9"/>
              <rect x="18" y="116" width="84" height="24" rx="8" fill="#58A6FF"/>
              <text x="33" y="134" font-family="Fira Code, monospace" font-size="13" fill="#0D1117">&lt;/&gt;</text>
            </g>
          </svg>
          SVG

      - name: Publicar SVG na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}