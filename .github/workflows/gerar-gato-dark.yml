name: Gerar versão dark do gato dev

on:
  push:
    branches:
      - main
    paths:
      - "assets/gato-dev.svg"
      - ".github/workflows/gerar-gato-dark.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-dark:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Gerar gato-dev-dark.svg
        run: |
          python <<'PY'
          from pathlib import Path

          origem = Path("assets/gato-dev.svg")
          destino = Path("assets/gato-dev-dark.svg")

          if not origem.exists():
              raise FileNotFoundError("Arquivo assets/gato-dev.svg não encontrado.")

          svg = origem.read_text(encoding="utf-8")

          substituicoes = {
              "#F6F8FA": "#0D1117",
              "#FFFFFF": "#161B22",
              "#D0D7DE": "#30363D",
              "#24292F": "#C9D1D9",
              "#0969DA": "#58A6FF",
              "#D8DEE4": "#30363D"
          }

          for claro, escuro in substituicoes.items():
              svg = svg.replace(claro, escuro)

          destino.write_text(svg, encoding="utf-8")
          PY

      - name: Commitar versão dark
        run: |
          if [[ -n "$(git status --porcelain assets/gato-dev-dark.svg)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add assets/gato-dev-dark.svg
            git commit -m "chore(readme): atualiza versão dark do gato dev"
            git push
          else
            echo "Nenhuma alteração na versão dark."
          fi