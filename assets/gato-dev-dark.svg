<svg width="900" height="260" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="900" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#EEF5FF"/>
    </linearGradient>

    <linearGradient id="blueGradient" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#54AEFF"/>
    </linearGradient>

    <filter id="windowShadow" x="-8%" y="-10%" width="116%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1F2328" flood-opacity="0.12"/>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1F2328" flood-opacity="0.14"/>
    </filter>

    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }
    </style>
  </defs>

  <!-- Fundo -->
  <rect width="900" height="260" rx="18" fill="url(#bgGradient)"/>

  <!-- Decoração -->
  <circle cx="805" cy="52" r="46" fill="#58A6FF" opacity="0.05"/>
  <circle cx="838" cy="208" r="64" fill="#54AEFF" opacity="0.08"/>

  <g opacity="0.45">
    <path d="M805 40V58M796 49H814" stroke="#58A6FF" stroke-width="4" stroke-linecap="round">
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="2.8s" repeatCount="indefinite"/>
    </path>

    <path d="M850 105H875" stroke="#58A6FF" stroke-width="4" stroke-linecap="round"/>
    <path d="M862 117H875" stroke="#58A6FF" stroke-width="4" stroke-linecap="round" opacity="0.45"/>

    <text x="612" y="82" class="mono" font-size="28" font-weight="800" fill="#58A6FF">&lt;/&gt;</text>

    <circle cx="620" cy="135" r="4" fill="#58A6FF">
      <animate attributeName="cy" values="135;128;135" dur="2.2s" repeatCount="indefinite"/>
    </circle>

    <path d="M646 150C620 164 630 190 665 188" stroke="#58A6FF" stroke-width="2.2" stroke-dasharray="6 8" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="0;-28" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Janela -->
  <rect x="40" y="25" width="820" height="210" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1.6" filter="url(#windowShadow)"/>

  <!-- Barra superior -->
  <path d="M40 41C40 32.1634 47.1634 25 56 25H844C852.837 25 860 32.1634 860 41V66H40V41Z" fill="#F3F6F9"/>
  <line x1="40" y1="66" x2="860" y2="66" stroke="#30363D" stroke-width="1.6"/>

  <circle cx="66" cy="45" r="6.5" fill="#FF605C"/>
  <circle cx="88" cy="45" r="6.5" fill="#FFBD44"/>
  <circle cx="110" cy="45" r="6.5" fill="#00CA4E"/>

  <!-- Conteúdo terminal -->
  <g class="mono">
    <text x="70" y="108" fill="#58A6FF" font-size="17" font-weight="800">$ npm run dev</text>
    <text x="70" y="139" fill="#C9D1D9" font-size="17" font-weight="600">Felipe Barbosa iniciando projetos...</text>

    <rect x="516" y="121" width="12" height="24" rx="2" fill="#58A6FF">
      <animate attributeName="opacity" values="1;0.15;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Linha -->
  <line x1="40" y1="175" x2="590" y2="175" stroke="#E1E4E8" stroke-width="2"/>

  <!-- Ícone celular -->
  <g transform="translate(78 187)" filter="url(#softShadow)">
    <animateTransform attributeName="transform" type="translate" values="78 187;78 184;78 187" dur="3s" repeatCount="indefinite"/>
    <rect x="0" y="0" width="32" height="42" rx="7" fill="#0D1117" stroke="#C9D1D9" stroke-width="2.6"/>
    <rect x="9" y="4" width="14" height="3.5" rx="1.75" fill="#C9D1D9"/>
    <rect x="7" y="13" width="10" height="10" rx="2" fill="url(#blueGradient)"/>
    <line x1="22" y1="15" x2="27" y2="15" stroke="#30363D" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="22" x2="27" y2="22" stroke="#30363D" stroke-width="2" stroke-linecap="round"/>
    <circle cx="16" cy="35" r="2.5" fill="#58A6FF"/>
  </g>

  <line x1="160" y1="185" x2="160" y2="225" stroke="#30363D" stroke-width="2"/>

  <!-- Ícone navegador -->
  <g transform="translate(198 188)" filter="url(#softShadow)">
    <animateTransform attributeName="transform" type="translate" values="198 188;198 185;198 188" dur="3.4s" repeatCount="indefinite"/>
    <rect x="0" y="0" width="58" height="38" rx="6" fill="#0D1117" stroke="#C9D1D9" stroke-width="2.6"/>
    <line x1="0" y1="11" x2="58" y2="11" stroke="#C9D1D9" stroke-width="2.6"/>
    <circle cx="8" cy="5.5" r="2" fill="#58A6FF"/>
    <circle cx="15" cy="5.5" r="2" fill="#54AEFF"/>
    <circle cx="22" cy="5.5" r="2" fill="#58A6FF"/>
    <rect x="10" y="18" width="18" height="13" rx="2" fill="url(#blueGradient)"/>
    <line x1="35" y1="20" x2="49" y2="20" stroke="#30363D" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="28" x2="48" y2="28" stroke="#30363D" stroke-width="3" stroke-linecap="round"/>
  </g>

  <line x1="300" y1="185" x2="300" y2="225" stroke="#30363D" stroke-width="2"/>

  <!-- Ícone banco -->
  <g transform="translate(335 186)" filter="url(#softShadow)">
    <animateTransform attributeName="transform" type="translate" values="335 186;335 183;335 186" dur="3.8s" repeatCount="indefinite"/>

    <ellipse cx="17" cy="8" rx="17" ry="6" fill="#0D1117" stroke="#C9D1D9" stroke-width="2.6"/>
    <path d="M0 8V32C0 38 34 38 34 32V8" fill="#0D1117" stroke="#C9D1D9" stroke-width="2.6"/>
    <path d="M0 20C0 26 34 26 34 20" stroke="#C9D1D9" stroke-width="2.6"/>
    <circle cx="26" cy="19" r="2.4" fill="#58A6FF"/>
    <circle cx="26" cy="31" r="2.4" fill="#58A6FF"/>

    <line x1="47" y1="39" x2="83" y2="39" stroke="#C9D1D9" stroke-width="2.6" stroke-linecap="round"/>

    <rect x="51" y="27" width="7" height="12" rx="2" fill="#8CC8FF">
      <animate attributeName="height" values="12;20;12" dur="1.7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="27;19;27" dur="1.7s" repeatCount="indefinite"/>
    </rect>

    <rect x="63" y="19" width="7" height="20" rx="2" fill="#54AEFF">
      <animate attributeName="height" values="20;28;20" dur="1.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="19;11;19" dur="1.9s" repeatCount="indefinite"/>
    </rect>

    <rect x="75" y="8" width="7" height="31" rx="2" fill="#58A6FF">
      <animate attributeName="height" values="31;22;31" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="8;17;8" dur="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <line x1="455" y1="185" x2="455" y2="225" stroke="#30363D" stroke-width="2"/>

  <!-- Ícone notebook -->
  <g transform="translate(492 188)" filter="url(#softShadow)">
    <animateTransform attributeName="transform" type="translate" values="492 188;492 185;492 188" dur="3.2s" repeatCount="indefinite"/>

    <rect x="0" y="0" width="58" height="36" rx="5" fill="#0D1117" stroke="#C9D1D9" stroke-width="2.6"/>
    <rect x="7" y="7" width="44" height="22" rx="2" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <text x="29" y="24" class="mono" font-size="16" font-weight="800" fill="#58A6FF" text-anchor="middle">&lt;/&gt;</text>
    <path d="M-7 42H65L57 36H1L-7 42Z" fill="#C9D1D9"/>

    <g transform="translate(69 31)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="5s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="10" fill="#0D1117" stroke="#C9D1D9" stroke-width="2.4"/>
      <circle cx="0" cy="0" r="4" fill="#58A6FF"/>
      <path d="M0 -14V-10M0 10V14M-14 0H-10M10 0H14M-10 -10L-7 -7M7 7L10 10M10 -10L7 -7M-10 10L-7 7" stroke="#C9D1D9" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- GATO -->
  <g id="dev-cat" transform="translate(630 18)">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="630 18;630 14;630 18"
      dur="2.8s"
      repeatCount="indefinite"/>

    <!-- sombra -->
    <ellipse cx="122" cy="212" rx="98" ry="14" fill="#58A6FF" opacity="0.10"/>

    <!-- rabo melhorado -->
    <g id="cat-tail" transform="translate(178 128)">
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 0 42;6 0 42;-4 0 42;0 0 42"
        dur="2.8s"
        repeatCount="indefinite"/>
      <path
        d="M0 66
           C20 66, 45 63, 63 54
           C83 44, 97 27, 98 8
           C99 -8, 88 -20, 74 -21
           C58 -22, 45 -13, 40 1
           C35 15, 38 28, 48 38
           C56 46, 67 50, 77 50
           C67 57, 42 64, 0 66Z"
        fill="#111318"/>
      <path
        d="M18 57
           C38 56, 57 51, 73 40
           C84 32, 91 20, 92 8"
        fill="none"
        stroke="#2B313A"
        stroke-width="3"
        stroke-linecap="round"
        opacity="0.42"/>
    </g>

    <!-- corpo -->
    <path
      d="M73 121
         C54 133, 49 168, 59 192
         C71 203, 156 203, 171 191
         C181 166, 176 133, 154 120
         C133 108, 95 108, 73 121Z"
      fill="#171A20"/>

    <!-- roupa preta -->
    <path
      d="M85 125
         C97 137, 110 145, 123 146
         C137 145, 150 137, 162 125
         C173 144, 174 170, 166 193
         C143 199, 94 199, 69 193
         C61 169, 65 144, 85 125Z"
      fill="#0E1116"/>

    <!-- abas da roupa -->
    <path d="M85 125L122 151L102 175L74 137Z" fill="#1A1E25"/>
    <path d="M162 125L124 151L144 175L172 137Z" fill="#1A1E25"/>

    <!-- detalhe azul -->
    <path d="M109 150L123 160L137 150" fill="none" stroke="#58A6FF" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- medalha -->
    <g id="cat-badge">
      <circle cx="123" cy="162" r="19" fill="#0B0D12" stroke="#58A6FF" stroke-width="2.3"/>
      <text x="123" y="168" class="mono" font-size="16" font-weight="800" fill="#54AEFF" text-anchor="middle">&lt;/&gt;</text>
    </g>

    <!-- patas -->
    <path
      d="M72 183
         C59 184, 55 201, 71 201
         H94
         C99 196, 97 182, 86 179Z"
      fill="#171A20"/>
    <path
      d="M139 179
         C129 182, 126 196, 131 201
         H158
         C174 201, 170 182, 156 180Z"
      fill="#171A20"/>

    <path d="M74 195V201M87 194V201M143 194V201M156 195V201"
          stroke="#0B0D12"
          stroke-width="3"
          stroke-linecap="round"/>

    <!-- cabeça sem cabelo -->
    <path
      d="M58 63
         C52 34, 66 10, 90 37
         C101 29, 113 26, 123 26
         C133 26, 145 29, 156 37
         C180 10, 194 34, 188 63
         C197 101, 169 132, 123 132
         C77 132, 49 101, 58 63Z"
      fill="#171A20"/>

    <!-- orelhas -->
    <path d="M77 24L95 44L68 50C67 38 70 29 77 24Z" fill="#171A20"/>
    <path d="M169 24L151 44L178 50C179 38 176 29 169 24Z" fill="#171A20"/>

    <!-- interior das orelhas -->
    <path d="M84 31L93 42L77 46C77 40 79 35 84 31Z" fill="#F3B6B3"/>
    <path d="M162 31L153 42L169 46C169 40 167 35 162 31Z" fill="#F3B6B3"/>

    <!-- sobrancelhas -->
    <path d="M88 61C95 56 103 54 111 55" stroke="#0B0D12" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M135 55C143 54 151 56 158 61" stroke="#0B0D12" stroke-width="3.4" stroke-linecap="round"/>

    <!-- olhos -->
    <ellipse cx="99" cy="84" rx="16" ry="19" fill="#0D1117"/>
    <ellipse cx="147" cy="84" rx="16" ry="19" fill="#0D1117"/>

    <ellipse cx="102" cy="87" rx="9" ry="12.5" fill="#0D1117"/>
    <ellipse cx="144" cy="87" rx="9" ry="12.5" fill="#0D1117"/>

    <circle cx="105" cy="79" r="3.1" fill="#161B22"/>
    <circle cx="147" cy="79" r="3.1" fill="#161B22"/>

    <!-- nariz -->
    <path d="M117 100H129L123 107Z" fill="#0B0D12"/>

    <!-- boca -->
    <path d="M123 107C116 114 106 114 100 108" stroke="#0B0D12" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M123 107C130 114 140 114 146 108" stroke="#0B0D12" stroke-width="2.8" stroke-linecap="round"/>

    <!-- focinho -->
    <path d="M109 110C114 115 132 115 137 110" stroke="#1F232B" stroke-width="2" stroke-linecap="round" opacity="0.35"/>

    <!-- bigodes -->
    <g id="cat-whiskers">
      <path
        d="M84 98H46M86 108L53 117M160 98H199M158 108L191 117"
        stroke="#0B0D12"
        stroke-width="2.8"
        stroke-linecap="round"/>
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;1 0;0 0"
        dur="2.6s"
        repeatCount="indefinite"/>
    </g>

    <!-- textos flutuando -->
    <g class="mono" fill="#58A6FF" font-weight="800" opacity="0.85">
      <text x="8" y="54" font-size="14">{ }</text>
      <text x="194" y="79" font-size="13">git</text>
      <text x="30" y="151" font-size="12">dev</text>
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;0 -5;0 0"
        dur="3s"
        repeatCount="indefinite"/>
    </g>
  </g>
</svg>